name: FioBench
options:
  bundleIdPrefix: com.fiobench
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  FioBench:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: FioBench
        excludes:
          - "Bridge/FioBridge.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiobench
        PRODUCT_NAME: FioBench
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/FioBench/Bridge/FioBridge.h
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  FioBench:
    build:
      targets:
        FioBench: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
